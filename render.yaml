# Render Blueprint — backend API + PostgreSQL. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: pms-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: TypeScript and the Prisma CLI are needed to build and migrate.
    buildCommand: npm ci --include=dev && npm run build && npm run db:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: pms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      # Replace with the deployed web URL once it exists (comma-separate several).
      - key: CORS_ORIGIN
        value: http://localhost:5173
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: AUTH_RATE_LIMIT_MAX
        value: "10"

databases:
  - name: pms-db
    plan: free
    databaseName: pms
